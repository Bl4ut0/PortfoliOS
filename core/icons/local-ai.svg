<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0720"/>
      <stop offset="50%" stop-color="#180b2e"/>
      <stop offset="100%" stop-color="#090416"/>
    </linearGradient>

    <!-- Synapse Gradient -->
    <linearGradient id="ai-synapse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="ai-core-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <filter id="ai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ai-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Tile -->
  <rect width="512" height="512" rx="112" fill="url(#ai-bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.3"/>

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#a855f7" opacity="0.15" filter="url(#ai-bloom)"/>
  <circle cx="256" cy="256" r="100" fill="#ec4899" opacity="0.2" filter="url(#ai-bloom)"/>

  <!-- Neural Geometry Orbitals -->
  <g stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <circle cx="256" cy="256" r="170" stroke-dasharray="6,8"/>
    <ellipse cx="256" cy="256" rx="160" ry="80" stroke-dasharray="4,6" transform="rotate(30 256 256)"/>
    <ellipse cx="256" cy="256" rx="160" ry="80" stroke-dasharray="4,6" transform="rotate(-30 256 256)"/>
  </g>

  <!-- Synaptic Interconnection Network (Lines) -->
  <g stroke="url(#ai-synapse)" stroke-width="3" stroke-linecap="round" opacity="0.75" filter="url(#ai-glow)">
    <!-- Core to Outer Nodes -->
    <line x1="256" y1="256" x2="160" y2="160"/>
    <line x1="256" y1="256" x2="352" y2="160"/>
    <line x1="256" y1="256" x2="130" y2="256"/>
    <line x1="256" y1="256" x2="382" y2="256"/>
    <line x1="256" y1="256" x2="175" y2="355"/>
    <line x1="256" y1="256" x2="337" y2="355"/>
    <line x1="256" y1="256" x2="256" y2="120"/>
    <line x1="256" y1="256" x2="256" y2="390"/>

    <!-- Ring Interconnections -->
    <line x1="160" y1="160" x2="256" y2="120"/>
    <line x1="256" y1="120" x2="352" y2="160"/>
    <line x1="352" y1="160" x2="382" y2="256"/>
    <line x1="382" y1="256" x2="337" y2="355"/>
    <line x1="337" y1="355" x2="256" y2="390"/>
    <line x1="256" y1="390" x2="175" y2="355"/>
    <line x1="175" y1="355" x2="130" y2="256"/>
    <line x1="130" y1="256" x2="160" y2="160"/>
  </g>

  <!-- Central Synaptic Core -->
  <circle cx="256" cy="256" r="64" fill="url(#ai-core-radial)" filter="url(#ai-glow)"/>
  <circle cx="256" cy="256" r="32" fill="#ffffff" filter="url(#ai-glow)"/>
  <circle cx="256" cy="256" r="16" fill="#fdf4ff"/>

  <!-- Neural Nodes (Synapse Junctions) -->
  <g filter="url(#ai-glow)">
    <circle cx="256" cy="120" r="10" fill="#38bdf8"/>
    <circle cx="160" cy="160" r="11" fill="#ec4899"/>
    <circle cx="352" cy="160" r="11" fill="#a855f7"/>
    <circle cx="130" cy="256" r="9" fill="#f43f5e"/>
    <circle cx="382" cy="256" r="9" fill="#6366f1"/>
    <circle cx="175" cy="355" r="10" fill="#c084fc"/>
    <circle cx="337" cy="355" r="10" fill="#38bdf8"/>
    <circle cx="256" cy="390" r="8" fill="#a855f7"/>
  </g>

  <!-- Inner Node Cores (White Dots) -->
  <circle cx="256" cy="120" r="4" fill="#ffffff"/>
  <circle cx="160" cy="160" r="4" fill="#ffffff"/>
  <circle cx="352" cy="160" r="4" fill="#ffffff"/>
  <circle cx="130" cy="256" r="3" fill="#ffffff"/>
  <circle cx="382" cy="256" r="3" fill="#ffffff"/>
  <circle cx="175" cy="355" r="4" fill="#ffffff"/>
  <circle cx="337" cy="355" r="4" fill="#ffffff"/>
  <circle cx="256" cy="390" r="3" fill="#ffffff"/>
</svg>

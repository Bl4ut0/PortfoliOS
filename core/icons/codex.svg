<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="codex-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>

    <!-- Terminal Frame Gradient -->
    <linearGradient id="codex-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Prompt Gradient -->
    <linearGradient id="codex-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="codex-cursor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="codex-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="codex-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Tile -->
  <rect width="512" height="512" rx="112" fill="url(#codex-bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="150" fill="#10b981" opacity="0.12" filter="url(#codex-bloom)"/>
  <circle cx="180" cy="220" r="100" fill="#38bdf8" opacity="0.15" filter="url(#codex-bloom)"/>

  <!-- Terminal Window Console Body -->
  <rect x="76" y="86" width="360" height="340" rx="36" fill="url(#codex-frame)" stroke="#334155" stroke-width="3"/>
  <rect x="80" y="90" width="352" height="64" rx="32" fill="#0f172a" opacity="0.9"/>

  <!-- Console Header Controls (Red, Amber, Green LEDs) -->
  <circle cx="120" cy="122" r="8" fill="#ef4444" opacity="0.85"/>
  <circle cx="146" cy="122" r="8" fill="#f59e0b" opacity="0.85"/>
  <circle cx="172" cy="122" r="8" fill="#10b981" opacity="0.85" filter="url(#codex-glow)"/>

  <!-- Terminal Title / Subtext bar -->
  <rect x="210" y="116" width="110" height="12" rx="6" fill="#334155" opacity="0.6"/>
  <rect x="376" y="116" width="30" height="12" rx="6" fill="#1e293b"/>

  <!-- Linux / WASM Wafer Micro-Circuit Lines in Background -->
  <g stroke="#34d399" stroke-width="1.2" stroke-opacity="0.2" fill="none">
    <path d="M 120 180 L 120 380 L 392 380"/>
    <path d="M 392 180 L 392 350"/>
    <line x1="120" y1="340" x2="160" y2="340"/>
    <line x1="392" y1="310" x2="350" y2="310"/>
  </g>

  <!-- Glowing Terminal Prompt Chevron: >_ -->
  <g stroke="url(#codex-neon)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#codex-glow)">
    <polyline points="150,210 220,270 150,330"/>
  </g>

  <!-- Glowing Blinking Block Cursor -->
  <rect x="252" y="306" width="48" height="24" rx="6" fill="url(#codex-cursor)" filter="url(#codex-glow)"/>

  <!-- Holographic Code / Command Output Streams -->
  <g fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.65">
    <line x1="252" y1="230" x2="350" y2="230"/>
    <line x1="252" y1="260" x2="310" y2="260"/>
  </g>

  <!-- Tech Corner Badges / Nodes -->
  <circle cx="150" cy="210" r="4" fill="#38bdf8"/>
  <circle cx="220" cy="270" r="5" fill="#34d399" filter="url(#codex-glow)"/>
  <circle cx="150" cy="330" r="4" fill="#10b981"/>
</svg>

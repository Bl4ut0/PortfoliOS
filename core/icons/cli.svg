<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cli-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Shell Gradient -->
    <linearGradient id="cli-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="cli-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Tile -->
  <rect width="512" height="512" rx="112" fill="url(#cli-bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Subtle Shell Grid Matrix -->
  <g stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="240" x2="432" y2="240"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
  </g>

  <!-- Terminal Frame -->
  <rect x="80" y="96" width="352" height="320" rx="28" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>

  <!-- Header dots -->
  <circle cx="120" cy="132" r="7" fill="#ef4444" opacity="0.8"/>
  <circle cx="144" cy="132" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="168" cy="132" r="7" fill="#10b981" opacity="0.8"/>
  <line x1="80" y1="164" x2="432" y2="164" stroke="#1e293b" stroke-width="2"/>

  <!-- Command Prompt Chevron: >_ -->
  <g stroke="url(#cli-accent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#cli-glow)">
    <polyline points="144,216 220,280 144,344"/>
  </g>

  <!-- Underscore Cursor -->
  <rect x="256" y="324" width="72" height="20" rx="5" fill="#38bdf8" filter="url(#cli-glow)"/>

  <!-- Cyan accent trace -->
  <circle cx="220" cy="280" r="5" fill="#e0f2fe" filter="url(#cli-glow)"/>
</svg>

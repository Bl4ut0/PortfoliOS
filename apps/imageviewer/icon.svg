<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="iv-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="iv-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="iv-mountain-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="iv-mountain-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="iv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#iv-bg)" stroke="url(#iv-border)" stroke-width="8"/>

  <!-- Photo Frame Inside -->
  <rect x="76" y="86" width="360" height="290" rx="36" fill="#030712" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>

  <!-- Sun / Moon -->
  <circle cx="340" cy="170" r="42" fill="url(#iv-sun)" filter="url(#iv-glow)"/>

  <!-- Back Mountain -->
  <polygon points="120,370 230,220 340,370" fill="url(#iv-mountain-back)" opacity="0.85"/>

  <!-- Front Mountain -->
  <polygon points="210,370 330,200 420,370" fill="url(#iv-mountain-front)"/>

  <!-- Bottom Aperture / Zoom Ring Accent -->
  <circle cx="256" cy="410" r="28" fill="none" stroke="url(#iv-border)" stroke-width="5" stroke-dasharray="8 4"/>
  <circle cx="256" cy="410" r="12" fill="#38bdf8"/>
</svg>

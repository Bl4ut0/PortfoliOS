<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0a1f18"/>
    </linearGradient>

    <!-- Excel Green Gradient -->
    <linearGradient id="gs-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Sheet Page Gradient -->
    <linearGradient id="gs-sheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>

    <!-- AI Sparkle Magenta/Violet -->
    <linearGradient id="gs-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="gs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect width="512" height="512" rx="112" fill="url(#gs-bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Sheet Canvas Card -->
  <rect x="124" y="100" width="266" height="328" rx="16" fill="url(#gs-sheet)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.4))"/>

  <!-- Grid Header Row -->
  <rect x="124" y="100" width="266" height="42" rx="16" fill="url(#gs-green)"/>
  <rect x="124" y="126" width="266" height="16" fill="url(#gs-green)"/>

  <!-- Grid Vertical Lines -->
  <line x1="184" y1="100" x2="184" y2="428" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="250" y1="100" x2="250" y2="428" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="318" y1="100" x2="318" y2="428" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Grid Horizontal Lines -->
  <line x1="124" y1="180" x2="390" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="124" y1="222" x2="390" y2="222" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="124" y1="264" x2="390" y2="264" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="124" y1="306" x2="390" y2="306" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="124" y1="348" x2="390" y2="348" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="124" y1="390" x2="390" y2="390" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Selected Highlight Cell -->
  <rect x="185" y="223" width="64" height="40" fill="#a7f3d0" fill-opacity="0.6"/>
  <rect x="184" y="222" width="66" height="42" fill="none" stroke="#059669" stroke-width="2.5"/>

  <!-- Excel 'X' Badge Overhang -->
  <rect x="100" y="210" width="100" height="100" rx="20" fill="url(#gs-green)" filter="drop-shadow(0 8px 16px rgba(5,150,105,0.5))"/>
  <text x="150" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">X</text>

  <!-- AI Sparkle Emblem -->
  <g transform="translate(370, 70)" filter="url(#gs-glow)">
    <path d="M 28 0 C 28 15 15 28 0 28 C 15 28 28 41 28 56 C 28 41 41 28 56 28 C 41 28 28 15 28 0 Z" fill="url(#gs-ai)"/>
  </g>
  <g transform="translate(425, 125) scale(0.55)" filter="url(#gs-glow)">
    <path d="M 28 0 C 28 15 15 28 0 28 C 15 28 28 41 28 56 C 28 41 41 28 56 28 C 41 28 28 15 28 0 Z" fill="url(#gs-ai)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gsl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1c0702"/>
    </linearGradient>

    <!-- PowerPoint Orange Gradient -->
    <linearGradient id="gsl-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Slide Canvas Gradient -->
    <linearGradient id="gsl-slide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>

    <!-- AI Sparkle Magenta/Violet -->
    <linearGradient id="gsl-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="gsl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect width="512" height="512" rx="112" fill="url(#gsl-bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#f97316" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Presentation Slide 16:9 Aspect Canvas -->
  <rect x="110" y="130" width="292" height="230" rx="16" fill="url(#gsl-slide)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.4))"/>

  <!-- Presentation Slide Header Banner -->
  <rect x="110" y="130" width="292" height="40" rx="16" fill="url(#gsl-orange)"/>
  <rect x="110" y="154" width="292" height="16" fill="url(#gsl-orange)"/>

  <!-- Chart Graphics on Slide -->
  <!-- Pie segment / donut -->
  <circle cx="210" cy="255" r="40" fill="none" stroke="#fed7aa" stroke-width="18"/>
  <circle cx="210" cy="255" r="40" fill="none" stroke="#ea580c" stroke-width="18" stroke-dasharray="160 260" stroke-dashoffset="40"/>

  <!-- Bar chart bars -->
  <rect x="290" y="270" width="18" height="40" rx="4" fill="#fed7aa"/>
  <rect x="318" y="240" width="18" height="70" rx="4" fill="#fb923c"/>
  <rect x="346" y="210" width="18" height="100" rx="4" fill="#ea580c"/>

  <!-- Stand Legs under Presentation Screen -->
  <line x1="256" y1="360" x2="256" y2="410" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="410" x2="312" y2="410" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

  <!-- PowerPoint 'P' Badge Overhang -->
  <rect x="80" y="195" width="100" height="100" rx="20" fill="url(#gsl-orange)" filter="drop-shadow(0 8px 16px rgba(194,65,12,0.5))"/>
  <text x="130" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>

  <!-- AI Sparkle Emblem -->
  <g transform="translate(370, 70)" filter="url(#gsl-glow)">
    <path d="M 28 0 C 28 15 15 28 0 28 C 15 28 28 41 28 56 C 28 41 41 28 56 28 C 41 28 28 15 28 0 Z" fill="url(#gsl-ai)"/>
  </g>
  <g transform="translate(425, 125) scale(0.55)" filter="url(#gsl-glow)">
    <path d="M 28 0 C 28 15 15 28 0 28 C 15 28 28 41 28 56 C 28 41 41 28 56 28 C 41 28 28 15 28 0 Z" fill="url(#gsl-ai)"/>
  </g>
</svg>

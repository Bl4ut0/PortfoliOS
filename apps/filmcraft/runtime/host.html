<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FilmCraft</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1c1f; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  </style>
  <script src="./session-storage.js"></script>
  <script src="./host-bridge.js"></script>
</head>
<body>
  <canvas id="filmcraft_canvas"></canvas>
  <script type="module">
    try {
      const { default: init, start } = await import("./filmcraft_web.js");
      const wasm = await init({ module_or_path: new URL("filmcraft_web_bg.wasm", location.href) });
      await start("filmcraft_canvas");
      dispatchEvent(new CustomEvent("FilmCraftStarted", { detail: { wasm } }));
    } catch (e) {
      console.error("FilmCraft start error:", e);parent.postMessage({type:"craft:failed"},location.origin);
    }
  </script>
</body>
</html>

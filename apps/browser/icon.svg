<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="portal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Outer Portal Ring Gradient -->
    <linearGradient id="portal-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Inner Core Gradient -->
    <radialGradient id="portal-core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Blade / Horizon Gradient -->
    <linearGradient id="portal-blade-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="portal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="portal-core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Tile -->
  <rect width="512" height="512" rx="112" fill="url(#portal-bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Background Ambient Glow behind Portal -->
  <circle cx="256" cy="256" r="170" fill="#0284c7" opacity="0.18" filter="url(#portal-core-glow)"/>
  <circle cx="256" cy="256" r="120" fill="#6366f1" opacity="0.22" filter="url(#portal-core-glow)"/>

  <!-- Orbital Cybernetic Horizon Grid (Web Latitudes & Longitudes) -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <ellipse cx="256" cy="256" rx="180" ry="60" stroke-dasharray="4,6" transform="rotate(-25 256 256)"/>
    <ellipse cx="256" cy="256" rx="180" ry="60" stroke-dasharray="4,6" transform="rotate(35 256 256)"/>
  </g>

  <!-- Outer Tech Guide Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8,12"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Outer Portal Gate Arc Segments -->
  <g fill="none" stroke="url(#portal-ring-grad)" stroke-width="12" stroke-linecap="round" filter="url(#portal-glow)">
    <!-- Primary Upper Left Arc -->
    <path d="M 126 180 A 160 160 0 0 1 332 126"/>
    <!-- Primary Right Arc -->
    <path d="M 386 186 A 160 160 0 0 1 386 326"/>
    <!-- Primary Lower Left Arc -->
    <path d="M 332 386 A 160 160 0 0 1 126 332"/>
    <!-- Primary Left Arc -->
    <path d="M 96 256 A 160 160 0 0 1 126 180"/>
  </g>

  <!-- Aperture Blades / Iris Gates -->
  <g fill="none" stroke="url(#portal-blade-grad)" stroke-width="3.5" stroke-linecap="round">
    <path d="M 256 96 L 368 208"/>
    <path d="M 368 208 L 368 336"/>
    <path d="M 368 336 L 256 416"/>
    <path d="M 256 416 L 144 336"/>
    <path d="M 144 336 L 144 208"/>
    <path d="M 144 208 L 256 96"/>
  </g>

  <!-- Portal Inner Horizon (Core Gateway) -->
  <circle cx="256" cy="256" r="115" fill="url(#portal-core-grad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Dimensional Web Rays / Perspective Grid inside Gateway -->
  <g stroke="#67e8f9" stroke-width="1.2" stroke-opacity="0.4" fill="none">
    <circle cx="256" cy="256" r="85" stroke-dasharray="3,5"/>
    <circle cx="256" cy="256" r="55" stroke-opacity="0.6"/>
    <circle cx="256" cy="256" r="25" stroke-opacity="0.8"/>
    <line x1="256" y1="141" x2="256" y2="371" stroke-opacity="0.3"/>
    <line x1="141" y1="256" x2="371" y2="256" stroke-opacity="0.3"/>
    <line x1="175" y1="175" x2="337" y2="337" stroke-opacity="0.3"/>
    <line x1="337" y1="175" x2="175" y2="337" stroke-opacity="0.3"/>
  </g>

  <!-- Luminous Gateway Center Flare -->
  <circle cx="256" cy="256" r="12" fill="#ffffff" filter="url(#portal-glow)"/>
  <circle cx="256" cy="256" r="5" fill="#e0f2fe"/>

  <!-- Orbital Data Waypoints / Navigational Markers -->
  <circle cx="126" cy="180" r="5" fill="#38bdf8" filter="url(#portal-glow)"/>
  <circle cx="332" cy="126" r="5" fill="#67e8f9" filter="url(#portal-glow)"/>
  <circle cx="386" cy="326" r="5" fill="#818cf8" filter="url(#portal-glow)"/>
  <circle cx="126" cy="332" r="5" fill="#c084fc" filter="url(#portal-glow)"/>
  <circle cx="386" cy="186" r="4" fill="#a855f7"/>
  <circle cx="332" cy="386" r="4" fill="#38bdf8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#110526"/>
    </linearGradient>

    <!-- Markdown Violet Gradient -->
    <linearGradient id="gn-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Notes Card Gradient -->
    <linearGradient id="gn-page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>

    <!-- AI Sparkle Magenta/Violet -->
    <linearGradient id="gn-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="gn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect width="512" height="512" rx="112" fill="url(#gn-bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Notes Notepad Sheet -->
  <rect x="130" y="96" width="260" height="336" rx="16" fill="url(#gn-page)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.4))"/>

  <!-- Notepad Spiral Binding Rings at Top -->
  <rect x="156" y="86" width="12" height="24" rx="6" fill="#64748b"/>
  <rect x="196" y="86" width="12" height="24" rx="6" fill="#64748b"/>
  <rect x="236" y="86" width="12" height="24" rx="6" fill="#64748b"/>
  <rect x="276" y="86" width="12" height="24" rx="6" fill="#64748b"/>
  <rect x="316" y="86" width="12" height="24" rx="6" fill="#64748b"/>
  <rect x="356" y="86" width="12" height="24" rx="6" fill="#64748b"/>

  <!-- Notepad Header Bar -->
  <rect x="156" y="136" width="140" height="20" rx="6" fill="url(#gn-violet)"/>

  <!-- Markdown Symbol Outlines -->
  <rect x="210" y="180" width="150" height="90" rx="10" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <!-- M -->
  <path d="M 230 245 L 230 205 L 245 225 L 260 205 L 260 245" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Down Arrow -->
  <path d="M 315 205 L 315 240 M 300 225 L 315 240 L 330 225" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code/Text Lines -->
  <rect x="156" y="300" width="208" height="12" rx="4" fill="#a78bfa"/>
  <rect x="156" y="326" width="170" height="12" rx="4" fill="#ddd6fe"/>
  <rect x="156" y="352" width="190" height="12" rx="4" fill="#ddd6fe"/>
  <rect x="156" y="378" width="130" height="12" rx="4" fill="#ddd6fe"/>

  <!-- Notes 'N' Badge Overhang -->
  <rect x="96" y="195" width="100" height="100" rx="20" fill="url(#gn-violet)" filter="drop-shadow(0 8px 16px rgba(109,40,217,0.5))"/>
  <text x="146" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>

  <!-- AI Sparkle Emblem -->
  <g transform="translate(370, 70)" filter="url(#gn-glow)">
    <path d="M 28 0 C 28 15 15 28 0 28 C 15 28 28 41 28 56 C 28 41 41 28 56 28 C 41 28 28 15 28 0 Z" fill="url(#gn-ai)"/>
  </g>
  <g transform="translate(425, 125) scale(0.55)" filter="url(#gn-glow)">
    <path d="M 28 0 C 28 15 15 28 0 28 C 15 28 28 41 28 56 C 28 41 41 28 56 28 C 41 28 28 15 28 0 Z" fill="url(#gn-ai)"/>
  </g>
</svg>

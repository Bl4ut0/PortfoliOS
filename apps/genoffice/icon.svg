<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="go-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>

    <!-- Document Page Gradient -->
    <linearGradient id="go-doc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Word Blue -->
    <linearGradient id="go-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Excel Green -->
    <linearGradient id="go-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- PowerPoint Orange -->
    <linearGradient id="go-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- AI Sparkle Magenta/Violet -->
    <linearGradient id="go-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Fold Corner Shadow -->
    <linearGradient id="go-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="go-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect width="512" height="512" rx="112" fill="url(#go-bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Backing Stacked Page (Spreadsheet/Slides hint) -->
  <rect x="148" y="80" width="256" height="332" rx="20" fill="#334155" fill-opacity="0.5" stroke="#475569" stroke-width="2"/>
  <rect x="128" y="98" width="256" height="332" rx="20" fill="#1e293b" fill-opacity="0.8" stroke="#64748b" stroke-width="2"/>

  <!-- Main Front Document Canvas (Folded top-right corner) -->
  <path d="M 108 140
           C 108 126.7, 118.7 116, 132 116
           L 292 116
           L 372 196
           L 372 404
           C 372 417.3, 361.3 428, 348 428
           L 132 428
           C 118.7 428, 108 417.3, 108 404
           Z"
        fill="url(#go-doc-bg)"
        filter="drop-shadow(0 12px 24px rgba(0,0,0,0.45))"/>

  <!-- Folded Corner Triangle -->
  <path d="M 292 116
           L 292 180
           C 292 188.8, 299.2 196, 308 196
           L 372 196
           Z"
        fill="url(#go-fold)"/>

  <!-- Document Lines (Docs preview) -->
  <rect x="144" y="164" width="112" height="14" rx="7" fill="#64748b" fill-opacity="0.75"/>
  <rect x="144" y="196" width="124" height="10" rx="5" fill="#94a3b8" fill-opacity="0.7"/>
  <rect x="144" y="218" width="196" height="10" rx="5" fill="#cbd5e1" fill-opacity="0.8"/>
  <rect x="144" y="238" width="176" height="10" rx="5" fill="#cbd5e1" fill-opacity="0.8"/>
  <rect x="144" y="258" width="188" height="10" rx="5" fill="#cbd5e1" fill-opacity="0.8"/>

  <!-- Office Apps Segmented Bar / Brand Badges at bottom of Doc -->
  <g transform="translate(144, 290)">
    <!-- Word Doc bar -->
    <rect x="0" y="0" width="44" height="28" rx="6" fill="url(#go-blue)"/>
    <text x="22" y="19" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">W</text>

    <!-- Excel Sheets bar -->
    <rect x="52" y="0" width="44" height="28" rx="6" fill="url(#go-green)"/>
    <text x="74" y="19" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">X</text>

    <!-- PowerPoint Slides bar -->
    <rect x="104" y="0" width="44" height="28" rx="6" fill="url(#go-orange)"/>
    <text x="126" y="19" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">P</text>

    <!-- PDF bar -->
    <rect x="156" y="0" width="44" height="28" rx="6" fill="#dc2626"/>
    <text x="178" y="19" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">PDF</text>
  </g>

  <!-- Sheet Mini Grid lines -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.4" transform="translate(144, 332)">
    <line x1="0" y1="12" x2="200" y2="12"/>
    <line x1="0" y1="28" x2="200" y2="28"/>
    <line x1="0" y1="44" x2="200" y2="44"/>
    <line x1="0" y1="60" x2="200" y2="60"/>
    <line x1="50" y1="0" x2="50" y2="68"/>
    <line x1="100" y1="0" x2="100" y2="68"/>
    <line x1="150" y1="0" x2="150" y2="68"/>
  </g>

  <!-- AI Native Sparkle / Intelligence Emblem (Floating bottom-right) -->
  <g transform="translate(376, 376)" filter="url(#go-glow)">
    <!-- Aura circle -->
    <circle cx="0" cy="0" r="54" fill="#1e1b4b" stroke="url(#go-ai)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="48" fill="url(#go-bg)" fill-opacity="0.9"/>

    <!-- 4-point AI Star / Sparkle -->
    <path d="M 0 -36
             C 0 -12, 12 0, 36 0
             C 12 0, 0 12, 0 36
             C 0 12, -12 0, -36 0
             C -12 0, 0 -12, 0 -36
             Z"
          fill="url(#go-ai)"/>

    <!-- Mini satellite sparkle -->
    <path d="M 22 -24
             C 22 -16, 16 -10, 16 -10
             C 16 -10, 22 -4, 22 4
             C 22 -4, 28 -10, 28 -10
             C 28 -10, 22 -16, 22 -24
             Z"
          fill="#38bdf8"/>
  </g>
</svg>
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="portfolios-build" content="2026.10.30.9">
    <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self' https://accounts.google.com">
    <meta name="referrer" content="strict-origin-when-cross-origin">

        content="PortfoliOS is a personal portfolio network for development projects, homelab infrastructure, community tools, and professional IT work.">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="mobile/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090a0f'/%3E%3Cpath d='M8 10l7 6-7 6' stroke='%23f8fafc' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M18 22h7' stroke='%2322d3ee' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
    <script src="mobile/viewport.js?v=2026.10.30.9"></script>
    <link rel="stylesheet" href="styles-v1.css?v=2026.10.30.9">
    <script>
        // Instant Theme Resolver (eliminates boot and login screen flashbang)
        (function() {
            try {
                var themeId = localStorage.getItem("bl4ut0_last_theme");
                var primary = localStorage.getItem("bl4ut0_last_theme_primary");
                var accent = localStorage.getItem("bl4ut0_last_theme_accent");
                if (!themeId) {
                    var selectedUser = localStorage.getItem("bl4ut0CurrentUser");
                    if (selectedUser && selectedUser !== "bl4ut0") {
                        themeId = localStorage.getItem("bl4ut0_" + selectedUser + "_ThemeId");
                        primary = primary || localStorage.getItem("bl4ut0_" + selectedUser + "_ThemePrimary");
                        accent = accent || localStorage.getItem("bl4ut0_" + selectedUser + "_ThemeAccent");
                    }
                    if (!themeId) {
                        try {
                            var profiles = JSON.parse(localStorage.getItem("bl4ut0_private_profiles") || "{}");
                            for (var pid in profiles) {
                                var pTheme = localStorage.getItem("bl4ut0_" + pid + "_ThemeId");
                                if (pTheme) { themeId = pTheme; break; }
                            }
                        } catch(e) {}
                    }
                }
                themeId = themeId || "dark";
                document.documentElement.dataset.theme = themeId;
                var presets = {
                    "dark": { bg: "#050608", text: "#fafafa", pri: "#22d3ee", acc: "#34d399", cs: "dark" },
                    "light": { bg: "#f8fafc", text: "#0f172a", pri: "#0284c7", acc: "#059669", cs: "light" },
                    "oled": { bg: "#000000", text: "#ffffff", pri: "#00e5ff", acc: "#f8fafc", cs: "dark" },
                    "black-accent": { bg: "#f5f5f4", text: "#111111", pri: "#111111", acc: "#3f3f46", cs: "light" },
                    "terminal": { bg: "#020402", text: "#ecfdf5", pri: "#22c55e", acc: "#84cc16", cs: "dark" },
                    "glacier": { bg: "#eef7ff", text: "#0f172a", pri: "#2563eb", acc: "#7c3aed", cs: "light" },
                    "sunset": { bg: "#160b18", text: "#fff7ed", pri: "#fb7185", acc: "#f59e0b", cs: "dark" }
                };
                var p = presets[themeId] || presets["dark"];
                document.documentElement.style.colorScheme = p.cs;
                document.documentElement.style.setProperty("--bg", p.bg);
                document.documentElement.style.setProperty("--text", p.text);
                document.documentElement.style.setProperty("--theme-primary", primary || p.pri);
                document.documentElement.style.setProperty("--theme-accent", accent || p.acc);
            } catch(err) {}
        })();
        // Global System Debug Logger
        window.SystemLogs = [];
        window.SystemLogStartedAt = new Date().toISOString();
        window.addSystemLog = (type, message, error = null) => {
            const timestamp = new Date().toISOString();
            let logMsg = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
            if (error) {
                if (error.stack) {
                    logMsg += `\nStack: ${error.stack}`;
                } else if (error.message) {
                    logMsg += `\nError: ${error.message}`;
                } else {
                    logMsg += `\nError: ${JSON.stringify(error)}`;
                }
            }
            window.SystemLogs.push(logMsg);
            
            if (window.SystemLogs.length > 500) {
                window.SystemLogs.shift();
            }

            if (window.EventBus) {
                window.EventBus.emit("system:log-added", logMsg);
            }
        };

        window.addEventListener("error", (event) => {
            window.addSystemLog("error", `Unhandled Error: ${event.message} at ${event.filename}:${event.lineno}:${event.colno}`, event.error);
        });

        window.addEventListener("unhandledrejection", (event) => {
            const reason = event.reason;
            const message = reason instanceof Error ? reason.message : String(reason);
            window.addSystemLog("error", `Unhandled Promise Rejection: ${message}`, reason instanceof Error ? reason : null);
        });

        const originalConsoleError = console.error;
        console.error = function (...args) {
            originalConsoleError.apply(console, args);
            const msg = args.map(arg => {
                if (arg instanceof Error) return arg.message + (arg.stack ? "\n" + arg.stack : "");
                if (typeof arg === 'object') {
                    try { return JSON.stringify(arg); } catch(e) { return String(arg); }
                }
                return String(arg);
            }).join(" ");
            window.addSystemLog("error", msg);
        };

        const originalConsoleWarn = console.warn;
        console.warn = function (...args) {
            originalConsoleWarn.apply(console, args);
            const msg = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(" ");
            window.addSystemLog("warning", msg);
        };
    </script>
</head>

<body>
    <canvas id="network-canvas" aria-hidden="true"></canvas>

    <div class="boot-screen" id="boot-screen" role="dialog" aria-labelledby="boot-title"

        <div class="boot-panel">
            <div class="boot-lines" aria-hidden="true">
                <span>POST OK</span>
                <span>mount /personality/network</span>
                <span>load bl4ut0.session</span>
            </div>
            <div class="boot-mark">
                <span class="prompt-chevron">&gt;</span><span class="prompt-cursor">_</span>
            </div>
            <p class="eyebrow">Personal Network Console</p>
            <h1 id="boot-title">PortfoliOS</h1>
            <p id="boot-summary">Development projects, infrastructure, community links, and professional systems work
                in one interactive hub.</p>
            <p class="mobile-boot-note">
                <span aria-hidden="true">▯</span>
                Mobile has its own app shell. Desktop is still best for draggable windows and the game.
            </p>
            <div class="boot-actions" aria-label="Choose a session">
                <button class="primary-action" data-enter-view="desktop">
                    <span aria-hidden="true">▣</span>
                    Desktop
                </button>
                <button class="secondary-action" data-enter-view="mobile">
                    <span aria-hidden="true">▯</span>
                    Mobile
                </button>
                <button class="secondary-action" data-enter-view="quick">
                    <span aria-hidden="true">◈</span>
                    Quick
                </button>
            </div>
        </div>
    </div>

    <noscript>
        <div class="noscript">
            This portfolio uses JavaScript for the OS interface. Core links: GitHub
            https://github.com/Bl4ut0, Dev Hub https://bl4ut0.dev, Discord https://discord.gg/fEwanmFR9m.
        </div>
    </noscript>

    <script src="core/loading-manifest.js?v=2026.10.30.9"></script>
    <script src="core/staged-loader.js?v=2026.10.30.9"></script>
    <script src="core/boot.js?v=2026.10.30.9"></script>
    <script src="main.js?v=2026.10.30.9"></script>
</body>
</html>

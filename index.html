<head>

        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090a0f'/%3E%3Cpath d='M8 10l7 6-7 6' stroke='%23f8fafc' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M18 22h7' stroke='%2322d3ee' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
    <script src="mobile/viewport.js?v=2026.10.30.11"></script>
    <link rel="stylesheet" href="styles-v1.css?v=2026.10.30.11">
    <script>
        // Instant Theme Resolver (eliminates boot and login screen flashbang)
        (function() {
            try {
                var themeId = localStorage.getItem("bl4ut0_last_theme");
                var primary = localStorage.getItem("bl4ut0_last_theme_primary");
                var accent = localStorage.getItem("bl4ut0_last_theme_accent");
                if (!themeId) {
                    var selectedUser = localStorage.getItem("bl4ut0CurrentUser");
                    if (selectedUser && selectedUser !== "bl4ut0") {
                        themeId = localStorage.getItem("bl4ut0_" + selectedUser + "_ThemeId");
                        primary = primary || localStorage.getItem("bl4ut0_" + selectedUser + "_ThemePrimary");
                        accent = accent || localStorage.getItem("bl4ut0_" + selectedUser + "_ThemeAccent");
                    }
                    if (!themeId) {
                        try {
                            var profiles = JSON.parse(localStorage.getItem("bl4ut0_private_profiles") || "{}");
                            for (var pid in profiles) {
                                var pTheme = localStorage.getItem("bl4ut0_" + pid + "_ThemeId");
                                if (pTheme) { themeId = pTheme; break; }
                            }
                        } catch(e) {}
                    }
                }
                themeId = themeId || "dark";
                document.documentElement.dataset.theme = themeId;
                var presets = {
                    "dark": {
                        cs: "dark",
                        tokens: {
                            "--bg": "#050608",
                            "--panel": "rgba(9, 11, 16, 0.62)",
                            "--panel-strong": "rgba(14, 18, 26, 0.85)",
                            "--line": "rgba(255, 255, 255, 0.07)",
                            "--line-strong": "rgba(255, 255, 255, 0.14)",
                            "--text": "#fafafa",
                            "--text-soft": "#a1a1aa",
                            "--text-muted": "#71717a",
                            "--theme-primary": "#22d3ee",
                            "--theme-accent": "#34d399",
                            "--glass-bg": "rgba(10, 12, 18, 0.62)",
                            "--glass-border": "rgba(255, 255, 255, 0.07)",
                            "--glass-highlight": "inset 0 1px 0 0 rgba(255, 255, 255, 0.12)",
                            "--glass-shadow": "0 25px 50px -12px rgba(0, 0, 0, 0.75)",
                            "--on-primary": "#061017",
                            "--surface-raised": "rgba(255, 255, 255, 0.04)"
                        }
                    },
                    "light": {
                        cs: "light",
                        tokens: {
                            "--bg": "#f8fafc",
                            "--panel": "rgba(255, 255, 255, 0.85)",
                            "--panel-strong": "rgba(255, 255, 255, 0.96)",
                            "--line": "rgba(15, 23, 42, 0.12)",
                            "--line-strong": "rgba(15, 23, 42, 0.22)",
                            "--text": "#0f172a",
                            "--text-soft": "#475569",
                            "--text-muted": "#64748b",
                            "--theme-primary": "#0284c7",
                            "--theme-accent": "#059669",
                            "--glass-bg": "rgba(255, 255, 255, 0.82)",
                            "--glass-border": "rgba(15, 23, 42, 0.12)",
                            "--glass-highlight": "inset 0 1px 0 0 rgba(255, 255, 255, 0.9)",
                            "--glass-shadow": "0 22px 45px -18px rgba(15, 23, 42, 0.15)",
                            "--on-primary": "#ffffff",
                            "--surface-raised": "rgba(15, 23, 42, 0.05)"
                        }
                    },
                    "oled": {
                        cs: "dark",
                        tokens: {
                            "--bg": "#000000",
                            "--panel": "rgba(10, 10, 10, 0.85)",
                            "--panel-strong": "rgba(0, 0, 0, 0.96)",
                            "--line": "rgba(255, 255, 255, 0.09)",
                            "--line-strong": "rgba(255, 255, 255, 0.2)",
                            "--text": "#ffffff",
                            "--text-soft": "#d4d4d8",
                            "--text-muted": "#8a8a93",
                            "--theme-primary": "#00e5ff",
                            "--theme-accent": "#f8fafc",
                            "--glass-bg": "rgba(10, 10, 10, 0.85)",
                            "--glass-border": "rgba(255, 255, 255, 0.1)",
                            "--glass-highlight": "inset 0 1px 0 0 rgba(255, 255, 255, 0.09)",
                            "--glass-shadow": "0 28px 60px -18px rgba(0, 0, 0, 0.95)",
                            "--on-primary": "#000000",
                            "--surface-raised": "rgba(255, 255, 255, 0.06)"
                        }
                    },
                    "black-accent": {
                        cs: "light",
                        tokens: {
                            "--bg": "#f5f5f4",
                            "--panel": "rgba(255, 255, 255, 0.85)",
                            "--panel-strong": "rgba(255, 255, 255, 0.96)",
                            "--line": "rgba(24, 24, 27, 0.13)",
                            "--line-strong": "rgba(24, 24, 27, 0.24)",
                            "--text": "#111111",
                            "--text-soft": "#3f3f46",
                            "--text-muted": "#71717a",
                            "--theme-primary": "#111111",
                            "--theme-accent": "#3f3f46",
                            "--glass-bg": "rgba(255, 255, 255, 0.82)",
                            "--glass-border": "rgba(24, 24, 27, 0.14)",
                            "--glass-highlight": "inset 0 1px 0 0 rgba(255, 255, 255, 0.85)",
                            "--glass-shadow": "0 22px 45px -18px rgba(24, 24, 27, 0.15)",
                            "--on-primary": "#ffffff",
                            "--surface-raised": "rgba(24, 24, 27, 0.05)"
                        }
                    },
                    "terminal": {
                        cs: "dark",
                        tokens: {
                            "--bg": "#020402",
                            "--panel": "rgba(2, 8, 4, 0.8)",
                            "--panel-strong": "rgba(4, 18, 8, 0.94)",
                            "--line": "rgba(134, 239, 172, 0.12)",
                            "--line-strong": "rgba(134, 239, 172, 0.25)",
                            "--text": "#ecfdf5",
                            "--text-soft": "#bbf7d0",
                            "--text-muted": "#6ee7b7",
                            "--theme-primary": "#22c55e",
                            "--theme-accent": "#84cc16",
                            "--glass-bg": "rgba(2, 8, 4, 0.8)",
                            "--glass-border": "rgba(134, 239, 172, 0.12)",
                            "--glass-highlight": "inset 0 1px 0 0 rgba(134, 239, 172, 0.12)",
                            "--glass-shadow": "0 25px 50px -14px rgba(0, 0, 0, 0.9)",
                            "--on-primary": "#020402",
                            "--surface-raised": "rgba(34, 197, 94, 0.08)"
                        }
                    },
                    "glacier": {
                        cs: "light",
                        tokens: {
                            "--bg": "#eef7ff",
                            "--panel": "rgba(255, 255, 255, 0.85)",
                            "--panel-strong": "rgba(248, 250, 252, 0.96)",
                            "--line": "rgba(30, 64, 175, 0.13)",
                            "--line-strong": "rgba(30, 64, 175, 0.24)",
                            "--text": "#0f172a",
                            "--text-soft": "#334155",
                            "--text-muted": "#64748b",
                            "--theme-primary": "#2563eb",
                            "--theme-accent": "#7c3aed",
                            "--glass-bg": "rgba(255, 255, 255, 0.82)",
                            "--glass-border": "rgba(30, 64, 175, 0.13)",
                            "--glass-highlight": "inset 0 1px 0 0 rgba(255, 255, 255, 0.85)",
                            "--glass-shadow": "0 24px 48px -18px rgba(30, 64, 175, 0.15)",
                            "--on-primary": "#ffffff",
                            "--surface-raised": "rgba(37, 99, 235, 0.05)"
                        }
                    },
                    "sunset": {
                        cs: "dark",
                        tokens: {
                            "--bg": "#160b18",
                            "--panel": "rgba(30, 15, 32, 0.78)",
                            "--panel-strong": "rgba(45, 20, 45, 0.92)",
                            "--line": "rgba(254, 205, 211, 0.12)",
                            "--line-strong": "rgba(254, 205, 211, 0.22)",
                            "--text": "#fff7ed",
                            "--text-soft": "#fed7aa",
                            "--text-muted": "#f9a8d4",
                            "--theme-primary": "#fb7185",
                            "--theme-accent": "#f59e0b",
                            "--glass-bg": "rgba(30, 15, 32, 0.78)",
                            "--glass-border": "rgba(254, 205, 211, 0.1)",
                            "--glass-highlight": "inset 0 1px 0 0 rgba(254, 205, 211, 0.12)",
                            "--glass-shadow": "0 25px 55px -16px rgba(0, 0, 0, 0.72)",
                            "--on-primary": "#160b18",
                            "--surface-raised": "rgba(251, 113, 133, 0.08)"
                        }
                    }
                };
                var p = presets[themeId] || presets["dark"];
                document.documentElement.style.colorScheme = p.cs;
                for (var key in p.tokens) {
                    document.documentElement.style.setProperty(key, p.tokens[key]);
                }
                if (primary) document.documentElement.style.setProperty("--theme-primary", primary);
                if (accent) document.documentElement.style.setProperty("--theme-accent", accent);
            } catch(err) {}
        })();
        // Global System Debug Logger
        window.SystemLogs = [];
        window.SystemLogStartedAt = new Date().toISOString();
        window.addSystemLog = (type, message, error = null) => {
            const timestamp = new Date().toISOString();
            let logMsg = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
            if (error) {
                if (error.stack) {
                    logMsg += `\nStack: ${error.stack}`;
                } else if (error.message) {
                    logMsg += `\nError: ${error.message}`;
                } else {
                    logMsg += `\nError: ${JSON.stringify(error)}`;
                }
            }
            window.SystemLogs.push(logMsg);
            
            if (window.SystemLogs.length > 500) {
                window.SystemLogs.shift();
            }

            if (window.EventBus) {
                window.EventBus.emit("system:log-added", logMsg);
            }
        };

        window.addEventListener("error", (event) => {
            window.addSystemLog("error", `Unhandled Error: ${event.message} at ${event.filename}:${event.lineno}:${event.colno}`, event.error);
        });

        window.addEventListener("unhandledrejection", (event) => {
            const reason = event.reason;
            const message = reason instanceof Error ? reason.message : String(reason);
            window.addSystemLog("error", `Unhandled Promise Rejection: ${message}`, reason instanceof Error ? reason : null);
        });

        const originalConsoleError = console.error;
        console.error = function (...args) {
            originalConsoleError.apply(console, args);
            const msg = args.map(arg => {
                if (arg instanceof Error) return arg.message + (arg.stack ? "\n" + arg.stack : "");
                if (typeof arg === 'object') {
                    try { return JSON.stringify(arg); } catch(e) { return String(arg); }
                }
                return String(arg);
            }).join(" ");
            window.addSystemLog("error", msg);
        };

        const originalConsoleWarn = console.warn;
        console.warn = function (...args) {
            originalConsoleWarn.apply(console, args);
            const msg = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(" ");
            window.addSystemLog("warning", msg);
        };
    </script>
</head>

<body>
    <canvas id="network-canvas" aria-hidden="true"></canvas>

    <div class="boot-screen" id="boot-screen" role="dialog" aria-labelledby="boot-title"
        aria-describedby="boot-summary">
        <div class="boot-panel">
            <div class="boot-lines" aria-hidden="true">
                <span>POST OK</span>
                <span>mount /personality/network</span>
                <span>load bl4ut0.session</span>
            </div>
            <div class="boot-mark">
                <span class="prompt-chevron">&gt;</span><span class="prompt-cursor">_</span>
            </div>
            <p class="eyebrow">Personal Network Console</p>
            <h1 id="boot-title">PortfoliOS</h1>
            <p id="boot-summary">Development projects, infrastructure, community links, and professional systems work
                in one interactive hub.</p>
            <p class="mobile-boot-note">
                <span aria-hidden="true">▯</span>
                Mobile has its own app shell. Desktop is still best for draggable windows and the game.
            </p>
            <div class="boot-actions" aria-label="Choose a session">
                <button class="primary-action" data-enter-view="desktop">
                    <span aria-hidden="true">▣</span>
                    Desktop
                </button>
                <button class="secondary-action" data-enter-view="mobile">
                    <span aria-hidden="true">▯</span>
                    Mobile
                </button>
                <button class="secondary-action" data-enter-view="quick">
                    <span aria-hidden="true">◈</span>
                    Quick
                </button>
            </div>
        </div>
    </div>

    <noscript>
        <div class="noscript">
            This portfolio uses JavaScript for the OS interface. Core links: GitHub
            https://github.com/Bl4ut0, Dev Hub https://bl4ut0.dev, Discord https://discord.gg/fEwanmFR9m.
        </div>
    </noscript>

    <script src="core/loading-manifest.js?v=2026.10.30.11"></script>
    <script src="core/staged-loader.js?v=2026.10.30.11"></script>

    <script src="main.js?v=2026.10.30.11"></script>
</body>
</html>
